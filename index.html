    <script>
      // Each saved home-screen app gets its own identity and start page, so an
      // icon saved from /prompt always opens /prompt (iOS otherwise treats every
      // icon from this site as one app and reopens whatever page it last showed).
      (function () {
        var apps = { '/admin': ['admin', 'GID Admin'], '/jarvis': ['jarvis', 'Jarvis'], '/prompt': ['prompt', 'GID Prompt'], '/jarvis/tech': ['tech', 'GID Tech'] };
        var p = location.pathname.replace(/\/+$/, '');
        if (!apps[p]) return;
        document.getElementById('app-manifest').setAttribute('href', '/manifests/' + apps[p][0] + '.json');
        document.getElementById('app-touch-icon').setAttribute('href', '/icons/' + apps[p][0] + '-180.png');
        var t = document.createElement('meta'); t.name = 'apple-mobile-web-app-title'; t.content = apps[p][1];
        document.head.appendChild(t);
      })();
    </script>
